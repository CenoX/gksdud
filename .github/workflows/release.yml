name: Release

on:
  push:
    tags: ['v*', 'pre-v*']
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or commit to release
        required: true
        type: string
        default: main
      version:
        description: New stable version (for example 1.3.2)
        required: true
        type: string
      release_summary:
        description: User-facing release summary
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'CenoX/gksdud' && ((github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/pre-v'))) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: macos-15
    timeout-minutes: 30
    environment: release
    env:
      GKSDUD_RELEASE_TEAM_ID: ${{ secrets.GKSDUD_RELEASE_TEAM_ID }}
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Resolve source and validate release version
        id: version
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_SUMMARY: ${{ inputs.release_summary }}
        run: |
          set -euo pipefail
          # Never relabel changed application code as an existing version.
          ruby scripts/resolve-release.rb >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ steps.version.outputs.source_sha }}
          path: release-source
          persist-credentials: false

      - name: Prepare selected source version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          test -s release-source/LICENSE
          test -f release-source/build.sh
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $RELEASE_VERSION" release-source/Info.plist

      - name: Import Developer ID and store notarization credentials in temporary keychain
        env:
          CERTIFICATE_BASE64: ${{ secrets.GKSDUD_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.GKSDUD_CERTIFICATE_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.GKSDUD_NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.GKSDUD_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          : "${CERTIFICATE_BASE64:?Missing signing certificate secret}"
          : "${P12_PASSWORD:?Missing P12 password secret}"
          : "${NOTARY_APPLE_ID:?Missing notarization Apple ID secret}"
          : "${NOTARY_PASSWORD:?Missing notarization app-specific password secret}"
          keychain="$RUNNER_TEMP/gksdud-signing.keychain-db"
          certificate="$RUNNER_TEMP/gksdud-signing.p12"
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$P12_PASSWORD" -k "$keychain" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          team=${GKSDUD_RELEASE_TEAM_ID:?Missing release team ID secret}
          [[ "$team" =~ ^[A-Z0-9]{10}$ ]] || { echo 'Invalid release team ID.' >&2; exit 1; }
          identity=$(security find-identity -v -p codesigning "$keychain" | awk -v team="$team" '$0 ~ /"Developer ID Application:/ && index($0, "(" team ")\"") { print $2 }')
          [[ "$identity" =~ ^[A-Fa-f0-9]{40}$ ]] || { echo 'Expected one valid Developer ID Application identity for the release team.' >&2; exit 1; }
          printf 'GKSDUD_SIGN_IDENTITY=%s\nGKSDUD_NOTARY_KEYCHAIN=%s\n' "$identity" "$keychain" >> "$GITHUB_ENV"
          xcrun notarytool store-credentials gksdud --apple-id "$NOTARY_APPLE_ID" --team-id "$team" --password "$NOTARY_PASSWORD" --keychain "$keychain"
          rm -f "$certificate"

      - name: Build, self-test, notarize and staple Universal app
        working-directory: release-source
        env:
          GKSDUD_SIGN_MODE: developer-id
          GKSDUD_NOTARIZE: '1'
          GKSDUD_NOTARY_PROFILE: gksdud
          GKSDUD_APP_VERSION: ${{ steps.version.outputs.version }}
        run: bash build.sh

      - name: Name prerelease archive
        if: steps.version.outputs.prerelease == 'true'
        working-directory: release-source
        env:
          VERSION: ${{ steps.version.outputs.version }}
          FILENAME: ${{ steps.version.outputs.filename }}
        run: mv "outputs/gksdud-$VERSION-macos-universal.zip" "outputs/$FILENAME"

      - name: Verify archive and prepare release metadata
        env:
          GKSDUD_RELEASE_TAG: ${{ steps.version.outputs.tag }}
          GKSDUD_SOURCE_ROOT: ${{ github.workspace }}/release-source
          GKSDUD_APP_VERSION: ${{ steps.version.outputs.version }}
        run: ruby scripts/prepare-release.rb "$GITHUB_REPOSITORY"

      - name: Create tag for the verified source
        if: steps.version.outputs.tag_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          SOURCE_SHA: ${{ steps.version.outputs.source_sha }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$SOURCE_SHA"

      - name: Verify existing release without overwriting it
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          FILENAME: ${{ steps.version.outputs.filename }}
          GKSDUD_RELEASE_TAG: ${{ steps.version.outputs.tag }}
          GKSDUD_SOURCE_ROOT: ${{ github.workspace }}/release-source
          GKSDUD_APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')
          if printf '%s\n' "$releases" | grep -Fxq "$TAG"; then
            existing_dir=$(mktemp -d "$RUNNER_TEMP/gksdud-existing.XXXXXX")
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$existing_dir" \
              --pattern "$FILENAME" --pattern SHA256SUMS
            ruby -rdigest -e 'dir, name = ARGV; expected = "#{Digest::SHA256.file(File.join(dir, name)).hexdigest}  #{name}\n"; abort "Published checksum mismatch" unless File.read(File.join(dir, "SHA256SUMS")) == expected' "$existing_dir" "$FILENAME"
            ruby scripts/prepare-release.rb "$GITHUB_REPOSITORY" "$existing_dir/$FILENAME"
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo 'Existing release verified. No assets will be replaced.'
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Remove temporary signing credentials
        if: always()
        timeout-minutes: 2
        run: bash scripts/cleanup-signing.sh

      - name: Create stable draft or publish prerelease (never overwrite existing assets)
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          ASSET_VERSION: ${{ steps.version.outputs.asset_version }}
          FILENAME: ${{ steps.version.outputs.filename }}
          SOURCE_ROOT: ${{ github.workspace }}/release-source
        run: |
          set -euo pipefail
          options=(--draft --title "gksdud $VERSION" --notes-file .github/RELEASE_NOTES.md)
          if [[ "$PRERELEASE" == true ]]; then
            options=(--prerelease --latest=false --title "gksdud $VERSION Pre-release" --notes-file .github/PRERELEASE_NOTES.md --generate-notes)
          fi
          gh release create "$TAG" \
            "$SOURCE_ROOT/outputs/$FILENAME" \
            "$SOURCE_ROOT/outputs/release-$ASSET_VERSION/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            "${options[@]}"

      - name: Publish verified stable draft
        if: github.event_name == 'workflow_dispatch' && steps.version.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SUMMARY: ${{ inputs.release_summary }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: ruby scripts/publish-release.rb "$GITHUB_REPOSITORY" "$RELEASE_TAG"
